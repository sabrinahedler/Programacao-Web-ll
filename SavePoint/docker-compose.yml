version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: savepoint-mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: savepointdb
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_savepoint_data:/var/lib/mysql

volumes:
  mysql_savepoint_data: