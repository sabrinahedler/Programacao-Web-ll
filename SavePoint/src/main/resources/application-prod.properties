# Perfil de produção (AWS). Ativado com SPRING_PROFILES_ACTIVE=prod.
# Sem valor padrão: se a variável não existir, a aplicação NÃO sobe (falha segura).
api.security.token.secret=${JWT_SECRET}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O Flyway cria o schema (V1). "update" fica como rede de segurança enquanto a migration não estiver
# 100% alinhada às entidades; quando estiver, trocar para DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
