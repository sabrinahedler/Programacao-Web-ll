spring.application.name=savepointproject

# ===== Banco de dados =====
# Local: usa o MySQL do docker-compose.yml. Na AWS: definir DB_URL, DB_USERNAME e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/savepointdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway cria o schema (V1). baseline-on-migrate evita erro em bancos locais que já foram criados pelo Hibernate.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ===== E-mail (Mailtrap) — credenciais SOMENTE por variável de ambiente =====
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Segurança / JWT =====
# O valor padrão abaixo serve só para rodar local. Em produção (perfil prod) JWT_SECRET é obrigatório.
api.security.token.secret=${JWT_SECRET:dev-only-troque-esta-chave-em-producao-0123456789}
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:2}

# Administrador inicial (opcional): criado na subida se ADMIN_EMAIL e ADMIN_PASSWORD estiverem definidos.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Origens liberadas no CORS (separadas por vírgula). Ex.: https://savepoint.meudominio.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# ===== Observabilidade =====
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ===== Porta (Elastic Beanstalk usa 5000; EC2/Docker usa 8080) =====
server.port=${PORT:${SERVER_PORT:8080}}
