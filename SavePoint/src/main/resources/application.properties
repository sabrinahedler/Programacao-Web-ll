spring.application.name=savepointproject

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/savepointdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:savepoint}
spring.datasource.password=${DB_PASSWORD:savepoint}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.flyway.locations=classpath:db_migrations

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
