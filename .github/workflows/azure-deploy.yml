name: Deploy SavePoint to Azure

on:
  push:
    branches:
      - main
      - feature/deploy-azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Dar permissão de execução ao mvnw
        run: chmod +x SavePoint/mvnw

      - name: Compilar projeto com Maven
        working-directory: ./SavePoint
        run: ./mvnw clean package -DskipTests

      - name: Enviar pacote compilado para o Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'savepoint'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'SavePoint/target/*.jar'