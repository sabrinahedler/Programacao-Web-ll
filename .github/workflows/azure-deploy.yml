name: Deploy SavePoint to Azure

on:
  push:
    branches:
      - main
      - envio-para-a-Azure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixa o código do repositório
        uses: actions/checkout@v4

      - name: Configura o JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compila projeto com Maven
        working-directory: ./SavePoint
        run: mvn clean package -DskipTests

      - name: Pacote compilado para o Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'savepoint'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: 'SavePoint/target/*.jar'